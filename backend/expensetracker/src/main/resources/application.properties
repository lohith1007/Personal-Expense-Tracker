spring.application.name=expensetracker

# ---------- Database (override with environment variables if needed) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/expensetracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Secret must be at least 32 characters. Change it (or set JWT_SECRET) outside of local development.
app.jwt.secret=${JWT_SECRET:expense-tracker-dev-secret-change-me-0123456789}
app.jwt.expiration-minutes=120

# ---------- CORS ----------
# Comma separated list of origins allowed to call this API from a browser.
app.cors.allowed-origins=http://localhost:3000
